services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      AGENT_RUNNER_URL: http://agent-runner:8080
    ports:
      - "3001:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      agent-runner:
        condition: service_started

  agent-runner:
    build:
      context: ./agent-runner
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      LARDER_URL: http://app:3000
      LARDER_AGENT_TOKEN: ${LARDER_AGENT_TOKEN:?set a minted Agent Token in .env}
      # Headless kiro-cli auth — skips interactive browser login.
      KIRO_API_KEY: ${KIRO_API_KEY:?set a Kiro API key in .env}
    ports:
      - "127.0.0.1:8080:8080"
